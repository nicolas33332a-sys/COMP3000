# Same checks as scripts/check.ps1, run by GitHub on each push.
name: check
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    # The API tests need a real PostgreSQL/PostGIS database (same image as docker-compose.yml).
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: marinescope
          POSTGRES_PASSWORD: marinescope-local
          POSTGRES_DB: marinescope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marinescope -d marinescope"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build

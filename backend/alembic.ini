# Alembic (database migrations). Run from the backend folder:
#   python -m alembic upgrade head
[alembic]
script_location = migrations
# The database URL comes from DATABASE_URL (see marinescope/config.py).

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s

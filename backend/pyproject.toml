[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marinescope"
version = "0.1.0.dev0"
description = "MarineScope backend: scenario contract, API and NOAA OISST data pipeline"
requires-python = ">=3.12"
# Lower bounds only. The versions actually installed and tested are recorded in
# requirements.lock.txt (pip freeze).
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    "python-dotenv>=1.0",
    # The API reads the downloaded NOAA subset (NetCDF) to serve the reference layer.
    "numpy>=1.26",
    "xarray>=2024.1",
    "netCDF4>=1.6",
]

[project.optional-dependencies]
# Needed only for the reference plot drawn by marinescope.pipeline.inspect_oisst.
data = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["marinescope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
